<defs><linearGradient id="petbg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1f1312"/><stop offset="1" stop-color="#0e0909"/>
</linearGradient></defs>
<style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .brand{font-size:17px;font-weight:700;letter-spacing:2px;fill:#e8d8d4}
    .sub{font-size:10px;letter-spacing:1px;fill:#a3827d}
