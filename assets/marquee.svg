<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 88" width="840" height="88" role="img" aria-labelledby="mrqt mrqd">
<title id="mrqt">Marquee: The bearing of a child takes nine months, no matter how many women are assigned. — Fred Brooks</title>
<desc id="mrqd">Scrolling status line</desc>
<defs><linearGradient id="mrqbg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#173d2b"/><stop offset="1" stop-color="#0d2018"/>
</linearGradient></defs>
<style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .lbl{font-size:9.5px;letter-spacing:1.6px;fill:#79c9a4}
    .big{font-size:31px;font-weight:700;fill:#e6fff2}
    .med{font-size:15px;font-weight:700;fill:#e6fff2}
    .sm{font-size:11px;fill:#e6fff2}
    .dim{font-size:11px;fill:#79c9a4}
    
    .pulse{animation:pulse 3.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
    .crt{font-size:15px;fill:#e6fff2;letter-spacing:1px}
    .caret{animation:blip 1s steps(1) infinite}
    @keyframes blip{0%,49%{opacity:1}50%,100%{opacity:0}}
    .flicker{animation:flick 4.5s ease-in-out infinite}
    @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.82}98%{opacity:.94}}
</style>
<rect width="840" height="88" rx="14" fill="url(#mrqbg)"/>
<rect x="0.75" y="0.75" width="838.5" height="86.5" rx="13.5" fill="none" stroke="#5fd99a" stroke-opacity="0.35"/>
<g class="flicker"><rect x="14" y="14" width="812" height="46" rx="8" fill="#0d2018" stroke="#5fd99a" stroke-opacity="0.3"/><defs><clipPath id="mqpanel"><rect x="14" y="14" width="812" height="46" rx="8"/></clipPath></defs><g clip-path="url(#mqpanel)"><g transform="translate(14 14)"><rect x="0" y="0" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="3" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="6" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="9" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="12" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="15" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="18" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="21" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="24" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="27" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="30" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="33" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="36" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="39" width="812" height="1" fill="#e6fff2" opacity="0.05"/><rect x="0" y="42" width="812" height="1" fill="#e6fff2" opacity="0.05"/><g transform="translate(16 0)"><g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="24s" repeatCount="indefinite"/><text class="mono crt" x="0" y="28">The bearing of a child takes nine months, no matter how many women are assigned. — Fred Brooks</text><text class="mono crt" x="1000" y="28">The bearing of a child takes nine months, no matter how many women are assigned. — Fred Brooks</text><text class="mono crt" x="2000" y="28">The bearing of a child takes nine months, no matter how many women are assigned. — Fred Brooks</text></g></g></g></g><text class="mono lbl" x="14" y="78">NOW BROADCASTING</text><text class="mono lbl" x="826" y="78" text-anchor="end" opacity="0.8" fill="#5fd99a">ON AIR</text></g>
</svg>
