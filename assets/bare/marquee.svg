<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 88" width="840" height="88" role="img" aria-labelledby="mrqt mrqd">
<title id="mrqt">Marquee: Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away. — Antoine de Saint-Exupéry</title>
<desc id="mrqd">Scrolling status line</desc>
<defs><linearGradient id="mrqbg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#173d2b"/><stop offset="1" stop-color="#0d2018"/>
</linearGradient></defs>
<style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .lbl{font-size:9.5px;letter-spacing:1.6px;fill:#3f9c71}
    .big{font-size:31px;font-weight:700;fill:#008a42}
    .med{font-size:15px;font-weight:700;fill:#008a42}
    .sm{font-size:11px;fill:#008a42}
    .dim{font-size:11px;fill:#3f9c71}
    
    .pulse{animation:pulse 3.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.62}}
    .crt{font-size:15px;fill:#008a42;letter-spacing:1px}
    .caret{animation:blip 1s steps(1) infinite}
    @keyframes blip{0%,49%{opacity:1}50%,100%{opacity:0}}
    .flicker{animation:flick 4.5s ease-in-out infinite}
    @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.82}98%{opacity:.94}}
</style>

<g class="flicker"><rect x="14" y="14" width="812" height="46" rx="8" fill="#0d2018" stroke="#239359" stroke-opacity="0.3"/><defs><clipPath id="mqpanel"><rect x="14" y="14" width="812" height="46" rx="8"/></clipPath></defs><g clip-path="url(#mqpanel)"><g transform="translate(14 14)"><rect x="0" y="0" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="3" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="6" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="9" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="12" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="15" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="18" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="21" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="24" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="27" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="30" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="33" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="36" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="39" width="812" height="1" fill="#008a42" opacity="0.05"/><rect x="0" y="42" width="812" height="1" fill="#008a42" opacity="0.05"/><g transform="translate(16 0)"><g><animateTransform attributeName="transform" type="translate" from="0 0" to="-1400 0" dur="33s" repeatCount="indefinite"/><text class="mono crt" x="0" y="28">Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away. — Antoine de Saint-Exupéry</text><text class="mono crt" x="1400" y="28">Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away. — Antoine de Saint-Exupéry</text><text class="mono crt" x="2800" y="28">Perfection is achieved, not when there is nothing more to add, but when there is nothing left to take away. — Antoine de Saint-Exupéry</text></g></g></g></g><text class="mono lbl" x="14" y="78">NOW BROADCASTING</text><text class="mono lbl" x="826" y="78" text-anchor="end" opacity="0.8" fill="#239359">ON AIR</text></g>
</svg>
