<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300" role="img" aria-labelledby="pett petd">
<title id="pett">GRUB is hungry — 2 day(s) since the last commit, 2 resurrection(s)</title>
<desc id="petd">Reading the docs isn&#39;t committing. Nice try.</desc>
<defs><linearGradient id="petbg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#252c1c"/><stop offset="1" stop-color="#171b12"/>
</linearGradient></defs>
<style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace}
    .brand{font-size:17px;font-weight:700;letter-spacing:2px;fill:#dfe6cf}
    .sub{font-size:10px;letter-spacing:1px;fill:#94a37d}
    .say{font-size:12.5px;fill:#dfe6cf}
    .stat{font-size:11px;fill:#94a37d}
    .val{font-size:11px;fill:#dfe6cf;font-weight:700}
    .call{font-size:16px;font-weight:700;letter-spacing:2.5px;fill:#93ad78}
    .callsub{font-size:9px;letter-spacing:0.8px;fill:#94a37d}
    .who{font-weight:700;fill:#93ad78}
    .lid{opacity:0;animation:blink 5.4s steps(1) infinite}
    .bubble{animation:breathe 5s ease-in-out infinite}
    .meter{animation:meterpulse 2.6s ease-in-out infinite}
    
    
    
    
    .plea{animation:bob 2.1s ease-in-out infinite}
    .beat{animation:beat 2.1s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes beat{0%,100%{opacity:1}50%{opacity:.25}}
    @keyframes blink{0%,93%{opacity:0}94%,97%{opacity:1}98%,100%{opacity:0}}
    @keyframes breathe{0%,100%{opacity:1}50%{opacity:.86}}
    @keyframes meterpulse{0%,100%{opacity:1}50%{opacity:.6}}
    @keyframes tear{0%,100%{opacity:0;transform:translateX(0)}12%{opacity:.55;transform:translateX(-4px)}18%{opacity:0}61%{opacity:.4;transform:translateX(5px)}67%{opacity:0}}
    @keyframes desat{0%,100%{filter:saturate(.35)}50%{filter:saturate(0) contrast(1.25)}}
    @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes flash{0%{opacity:.8}100%{opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
</style>
