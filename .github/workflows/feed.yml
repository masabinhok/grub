name: Pet GRUB

# Petting is cosmetic by design. This workflow can bump a counter and put a heart
# on the card; it cannot feed the pet, change its mood, or resurrect it.
# scripts/feed_grub.js asserts that before it will save.
#
# THIS IS A PUBLIC WRITE PATH. Anyone can open an issue titled "pet ..." or
# "feed ..." and cause a commit to this repo. What keeps that boring:
#
#   - the script can only touch cosmetic counters, and asserts it
#   - one pet per person per UTC day
#   - MAX_PETS_PER_DAY across the whole repo (see scripts/lib/constants.js)
#   - nothing here checks out or runs untrusted code; an issue carries none
#   - the login and the title arrive as env vars and are validated in JS, never
#     interpolated into a shell command
#
# An opened issue that is *not* a pet request is left completely alone — no reply
# and, importantly, no auto-close. That gate lives in the script rather than in
# `if:` below because Actions expressions cannot lowercase a string, so a YAML
# startsWith would miss "Pet GRUB".
on:
  issues:
    types: [opened, labeled]
  repository_dispatch:
    types: [feed-grub]

permissions:
  contents: write
  issues: write

# Shares the daily job's group so a pet and a scheduled run can never race each
# other's push. Queued, not cancelled — dropping a pet would lose the counter bump.
concurrency:
  group: tamagotchi
  cancel-in-progress: false

jobs:
  pet:
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event.action == 'opened' ||
      github.event.label.name == 'feed-grub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pet the creature
        id: pet
        env:
          # Never interpolated into the shell directly — a login and an issue
          # title are attacker-controlled text, and ${{ }} inside `run` would be
          # a script injection. They go in as env vars and the script validates.
          ACTOR: >-
            ${{ github.event_name == 'repository_dispatch'
                && (github.event.client_payload.actor || github.actor)
                || github.event.issue.user.login }}
          FEED_EVENT: ${{ github.event_name == 'issues' && github.event.action || github.event_name }}
          FEED_TITLE: ${{ github.event.issue.title }}
        run: node scripts/feed_grub.js --actor "$ACTOR"

      # Redraws every card from the state file. --offline on purpose: this path is
      # user-triggered, so it must not spend API quota or need a token. The next
      # scheduled run refreshes the streak and traffic numbers.
      - name: Re-render the cards
        if: steps.pet.outputs.result == 'fed'
        run: node scripts/update_pet.js --offline

      - name: Commit if anything changed
        if: steps.pet.outputs.result == 'fed'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-state.json assets README.md
          git commit -m 'chore: pet GRUB [skip ci]'
          git push

      # Only replies to outcomes that were actually about the pet. A plain bug
      # report yields `ignored` and is never touched; a hard failure before the
      # script emitted anything yields an empty result and is also left alone,
      # so a crash can never close somebody's issue.
      - name: Reply and close
        if: >-
          always() && github.event_name == 'issues' &&
          contains(fromJSON('["fed","rate-limited","daily-cap","invalid-actor"]'),
                   steps.pet.outputs.result)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          # Written by feed_grub.js, so it is our text rather than the user's.
          BODY: ${{ steps.pet.outputs.message }}
        run: |
          gh issue comment "$ISSUE" --body "${BODY:-GRUB could not be petted. Check the job log.}"
          gh issue close "$ISSUE"
