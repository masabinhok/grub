name: Pet GRUB

# Petting is cosmetic by design. This workflow can bump a counter and put a heart
# on the card; it cannot feed the pet, change its mood, or resurrect it. See
# scripts/feed_grub.js — it asserts that before saving.
#
# WORTH KNOWING: adding a label to an issue requires write access to the repo, so
# as written this is a maintainer-only button. If you want strangers to be able to
# pet him — which is the point of the LURKERS/FED split on the counter card —
# change the types below to `[labeled, opened]` and enable the guard marked (A).
# Anyone opening an issue titled "pet ..." or "feed ..." then triggers a run.
on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [feed-grub]

permissions:
  contents: write
  issues: write

# Shares the daily job's group so a pet and a scheduled run can never race each
# other's push. Queued, not cancelled — dropping a pet would lose the counter bump.
concurrency:
  group: tamagotchi
  cancel-in-progress: false

jobs:
  pet:
    # (A) With the `opened` trigger enabled, add:
    #   || (github.event.action == 'opened' &&
    #       (startsWith(github.event.issue.title, 'pet') ||
    #        startsWith(github.event.issue.title, 'feed')))
    if: >-
      github.event_name == 'repository_dispatch' ||
      github.event.label.name == 'feed-grub'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Pet the creature
        id: pet
        env:
          # Never interpolated into the shell directly — a GitHub login is
          # attacker-controlled text, and ${{ }} inside `run` would be a script
          # injection. It goes in as an env var and the script re-validates it.
          ACTOR: >-
            ${{ github.event_name == 'repository_dispatch'
                && (github.event.client_payload.actor || github.actor)
                || github.event.issue.user.login }}
        run: node scripts/feed_grub.js --actor "$ACTOR"

      # Redraws every card from the state file. --offline on purpose: this path is
      # user-triggered, so it must not spend API quota or need a token. The next
      # scheduled run refreshes the streak and traffic numbers.
      - name: Re-render the cards
        if: steps.pet.outputs.result == 'fed'
        run: node scripts/update_pet.js --offline

      - name: Commit if anything changed
        if: steps.pet.outputs.result == 'fed'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-state.json assets README.md
          git commit -m 'chore: pet GRUB [skip ci]'
          git push

      - name: Reply and close
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          # Written by feed_grub.js, so it is our text rather than the user's.
          BODY: ${{ steps.pet.outputs.message }}
        run: |
          gh issue comment "$ISSUE" --body "${BODY:-GRUB could not be petted. Check the job log.}"
          gh issue close "$ISSUE"
