name: Tamagotchi of Shame

on:
  schedule:
    # 18:15 UTC = 00:00 in Kathmandu (UTC+5:45): midnight in the zone the creature
    # actually lives in, which is what `timezone` in grub.config.json sets.
    #
    # The run reports on the day that has just *ended*, which is the only moment
    # that day can be judged: at midnight it is finally known whether anything was
    # committed in it. That is also why this is the one time of day GitHub's
    # best-effort scheduler cannot spoil — every minute it runs late is still the
    # same local day, so a delayed run gives the same answer. A late-evening run
    # does not have that property: half an hour of slippage carries it over
    # midnight and it answers about the wrong day.
    #
    # Moving zones? Convert 00:00 local to UTC and change both this line and
    # `timezone` in the config. Getting one without the other is how the day
    # boundary ends up somewhere nobody lives.
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      simulate_days:
        description: 'Pretend this many whole days were missed (renders only, never saved)'
        required: false
        default: ''
      force_apology:
        description: 'Force a resurrection, ignoring commit messages'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Render and log only — write and commit nothing'
        type: boolean
        required: false
        default: false

  # Optional: uncomment to make the pet react the moment you push an apology
  # instead of waiting for the next midnight run. Safe against loops because the
  # bot's own commit carries [skip ci], which GitHub honours for push events.
  # push:
  #   branches: [main]

permissions:
  contents: write

# Shared with feed.yml: both push to main, and two pushes racing is how a run ends
# up rejected or, worse, clobbering the other's commit. Queued rather than
# cancelled — dropping this one would lose a day of view history.
concurrency:
  group: tamagotchi
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No actions/setup-node: ubuntu-latest ships Node 20+, and the script has
      # zero dependencies, so there is nothing to install. Keeps the job ~15s.
      - uses: actions/checkout@v4

      # Pull the Worker's live count into views.json *before* the cards are drawn,
      # so the eye card shows this run's number rather than yesterday's. This used
      # to be a second workflow (views.yml) on its own schedule, which meant two
      # jobs racing for the same push and a card whose number was hours older than
      # the run that drew it. One job, one push, one number.
      #
      # Skipped rather than failed when VIEWS_URL is unset, so a fork that never
      # deployed the Worker still gets its creature updated. And never fatal when
      # it is set: Cloudflare having a bad night must not stop the creature from
      # updating — a failure here just draws the card with the last committed
      # count, and the next run picks up every day it missed (see merge_views.js).
      - name: Refresh the view count
        if: vars.VIEWS_URL != '' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        env:
          VIEWS_URL: ${{ vars.VIEWS_URL }}
        run: node scripts/merge_views.js

      - name: Update the creature
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a classic PAT with `repo` scope, stored as a repo secret.
          # Only needed if the job log warns that private work is invisible —
          # with "Include private contributions on my profile" enabled, the
          # built-in GITHUB_TOKEN already sees the counts.
          PET_TOKEN: ${{ secrets.PET_TOKEN }}
          # ON: private repo work feeds the pet. If it cannot see any private
          # contributions, the script says so loudly in the job log rather than
          # letting the pet starve for the wrong reason.
          # Trade-off: private activity is only datable through the contribution
          # calendar, which also counts issues/PRs/reviews — not just commits.
          PET_INCLUDE_PRIVATE: '1'
          PET_USERNAME: ${{ github.repository_owner }}
          PET_SIMULATE_DAYS: ${{ github.event.inputs.simulate_days }}
        run: |
          node scripts/update_pet.js \
            ${{ github.event.inputs.force_apology == 'true' && '--apology' || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      # The no-background set, used by the profile README. Same state, same
      # numbers, same run — only the palette and the card chrome differ, so the
      # two sets can never disagree about what day it is.
      #
      # --bare counts as a preview inside update_pet.js, which is why it needs
      # its own --outdir and cannot touch assets/ or the state file.
      - name: Render the no-background set
        if: github.event.inputs.dry_run != 'true'
        run: node scripts/update_pet.js --offline --bare --outdir assets/bare

      # Reads each fork's public pet-state.json off raw.githubusercontent.com.
      # No token, one request per entry, and it swallows its own failures — the
      # wall is decoration and does not get to fail the creature's job.
      - name: Refresh the Wall of Shame
        if: github.event.inputs.dry_run != 'true'
        run: node scripts/render_wall.js

      - name: Commit if anything changed
        if: github.event.inputs.dry_run != 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed — no commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-state.json views.json assets README.md WALL-OF-SHAME.md
          git commit -m 'chore: update pet state [skip ci]'
          git push
